# Production Guardian — the whole chain, four services (#72).
#
#   docker compose up
#
# Then: http://localhost:5173/?mode=live
#
# NO WEB GATEWAY SERVICE. This image runs an embedded Apache on 52773 -- verified in the
# container: `httpd -f .../httpd.conf -d /usr/irissys/httpd -c Listen 52773`, plus the label
# `com.intersystems.ports.default.webserver=52773`. So /api/monitor/*, /labdemo/* and the
# Management Portal are all served by IRIS itself and a separate gateway has nothing to do.
#
# That REVERSES #53's premise for this image. "Nothing listens on 52773 anywhere" was true of
# containers.intersystems.com/intersystems/irishealth, which the demo instance runs; it is not
# true of the EAP AI Hub build. Established independently by @tanifgit on 2026.2 and confirmed
# here on 2026.3 (#78) -- so Production.cls's ORIGINAL 127.0.0.1:52773 was right all along for
# this image, and ApplyDeploymentSettings() (#73) is what switches between the two without a
# code change. Four files and one published port went away with the service.
#
# ONE-TIME PREREQUISITE. The IRIS image is not pullable — it comes from the InterSystems
# Early Access Program, which needs a customer login rather than a registry credential. So
# this file references a LOCAL TAG only, which is what lets compose reproduce *the* system
# our measurements were taken on (#70) with no credentials in the repo and no network
# dependency. See README.md "Prerequisites"; `docker/preflight.sh` prints the sequence if
# the tag is missing.
#
# ONE RUNTIME IMAGE. This file uses the EAP AI Hub image -- the one every live measurement
# on #70 was taken against -- and there is no second runtime image.
#
# CI's iris-compile job compiles against the PUBLIC intersystems/irishealth-community image
# because a GitHub-hosted runner cannot authenticate to a private registry, let alone perform
# an EAP download. So that job's choice was never "which image do we prefer" but
# "compile-check the ObjectScript on every PR, or not at all" (#77).
#
# Do not align them. The consequence -- iris-compile is a SUBSET check, and will go red on
# correct code the day we use an AI-Hub-only class -- is written up next to that job, with
# the options ranked, because the cheapest response to a red build is the worst one.

name: production-guardian

services:
  # ─── 0. volume permissions ──────────────────────────────────────────────────────────
  # A fresh named volume mounts root-owned (0:0), but IRIS runs as irisowner (51773), so
  # the very first start dies before the healthcheck ever runs:
  #
  #   Error while moving data directories ERROR #5001: Cannot create target: /iris-shared/durable/
  #   [FATAL] Error starting InterSystems IRIS (final attempt)
  #
  # WHY THIS WAS NOT ALREADY KNOWN: the working demo instance bind-mounts a Windows host
  # directory, and Docker Desktop's Windows bind mounts ignore unix ownership entirely, so
  # the durable path is writable there by accident of the platform. Switching to a named
  # volume -- which is what makes the namespace survive `compose down` -- is what exposes it.
  # The two mount types are not interchangeable, and this is the difference.
  #
  # Runs to completion and exits 0; `service_completed_successfully` below is what orders it
  # ahead of IRIS. Idempotent, so a restart on an already-correct volume is a no-op.
  iris-init:
    image: ${PG_IRIS_IMAGE:-productionguardian/irishealth:local}
    container_name: pg-iris-init
    user: root
    volumes:
      - iris-data:/iris-shared
    entrypoint: ["sh", "-c", "chown -R 51773:51773 /iris-shared && echo 'iris-init: /iris-shared owned by irisowner'"]

  # ─── 1. IRIS ────────────────────────────────────────────────────────────────────────
  # LABDEMO namespace, the production, and the HL7 generator.
  #
  # First boot is ProductionGuardian.Setup.FirstBoot (#73), which captures the nine manual
  # steps from the #34/#53 deploy — three of which were only discovered because the
  # production failed on first start. Without it this service would be a research task.
  iris:
    image: ${PG_IRIS_IMAGE:-productionguardian/irishealth:local}
    container_name: pg-iris
    ports:
      # 52773 is the embedded Apache: /api/monitor/*, /labdemo/* AND the Management Portal
      # (/csp/sys/UtilHome.csp). One published port where there used to be two, and this is
      # the one a human needs.
      - "${PG_IRIS_WEB_PORT:-52773}:52773"
    # 1972 is the superserver. Not published: nothing outside the compose network needs it
    # now that HTTP is served in-container.
    expose:
      - "1972"
    volumes:
      - iris-data:/iris-shared
      # Source, read-only. FirstBoot compiles from here, so a class change is a restart
      # rather than a rebuild.
      - ./iris:/pg-src:ro
      - ./docker/iris-firstboot.sh:/pg-firstboot.sh:ro
    environment:
      # ISC_DATA_DIRECTORY makes the namespace survive `compose down`; without it the
      # LABDEMO setup would re-run from scratch every time.
      ISC_DATA_DIRECTORY: /iris-shared/durable
      # Setup.AIHub.CreateProvider() reads these at first boot to create the AI Hub wallet entry
      # and the AI.LLM.pgdetective config. Declared HERE and not only in the shell: an exported
      # variable does not reach a container unless compose passes it, and without this line the
      # boot reported "SKIPPED -- PG_LLM_API_KEY is not set" while the variable was plainly set
      # in the caller's environment. Measured -- the README's own instructions failed on it.
      #
      # No default. Absent, the provider is not created, the boot says so, and AI Detective
      # degrades to a labelled canned investigation. A default here would be a committed key.
      PG_LLM_API_KEY: ${PG_LLM_API_KEY:-}
      PG_LLM_MODEL: ${PG_LLM_MODEL:-}
      # The dashboard's trigger buttons. UNSET BY DEFAULT and that is the safety property, not a
      # convenience: TriggerDispatcher returns 404 on every route without it, so a `compose up` with
      # no flag has no way to break the production from a browser. Set it only on a throwaway demo
      # instance -- the triggers deliberately disable hosts and repoint paths, which is the opposite
      # of the governed, bounded, audited Smart Resolve write.
      #
      # Passed to IRIS *and* to the engine below, because both need it: IRIS to decide whether the
      # routes exist, the engine to decide whether to advertise them to the UI. Two reads of one
      # variable rather than the engine trusting a 404, so a misconfigured pair is visible instead
      # of looking like a network fault.
      PG_DEMO_TRIGGERS: ${PG_DEMO_TRIGGERS:-}
    depends_on:
      iris-init:
        condition: service_completed_successfully
    # FIRST BOOT IS AUTOMATIC. `/iris-main -a <cmd>` runs a command AFTER `iris start`, which
    # is exactly FirstBoot's slot -- and it keeps /iris-main in charge of starting and stopping
    # IRIS, which was the stated reason for not automating this before.
    #
    # I previously wrote that automating it "needs either a sidecar or an image with a
    # first-boot hook", not having checked whether the image had one. It does; `/iris-main
    # --help` documents -a/-b/-c/-e. Verified empirically rather than from the flag name,
    # because whether it BLOCKS is the whole question: a 12s hook delays the log line
    # `...executed command` by 12s and TASKMGR starts within it, so it is synchronous and
    # ordered after `...started InterSystems IRIS instance`.
    #
    # `sh /pg-firstboot.sh`, not the bare path: the script is mounted :ro so its exec bit
    # cannot be used inside the container. It is idempotent, so this is also correct on every
    # later start -- and on a restart it is what clears a production left un-shut-down by
    # `docker stop`, which used to leave the stack dead every second run.
    command: ["-a", "sh /pg-firstboot.sh"]
    healthcheck:
      # "READY" MEANS THE LABDEMO PRODUCTION IS SERVING, not merely that IRIS started.
      #
      # /irisHealth.sh alone -- which is what this used to be -- goes healthy as soon as the
      # instance is up, which on a first run is minutes before LABDEMO exists. Every service
      # gated on it therefore started against an instance with no production, and the proxy
      # (whose own healthcheck requires interop metrics) could never become healthy, so the
      # engine's dependency never resolved and `compose up` ended with two services stuck in
      # `created` and an error about an unhealthy dependency. The cause was three services
      # away from the message.
      #
      # Probing the metrics endpoint for an interop family instead makes the readiness signal
      # mean what dependents actually need. It also makes the wait self-resolving: the proxy
      # simply waits for IRIS to say it is ready, rather than racing it.
      #
      # GATES ON *OUR* PRODUCTION BY NAME, not on the generic `iris_interop_` family.
      #
      # The family only proves that SOME production is running in SOME interop-enabled
      # namespace, and this image ships LABDEMO already interop-enabled (FirstBoot reports
      # "already interop-enabled" on a cold volume, which is also why a cold `up` is ~60s
      # rather than the minutes an EnableNamespace would cost). The `-a` hook and the
      # healthcheck then run concurrently, so a generic grep could open the gate before
      # FirstBoot has started ours -- the proxy would poll the wrong production, and the
      # engine's rolling baseline would warm on its metrics. Nothing would look broken:
      # the hosts would briefly be wrong and the baseline quietly polluted (@tanifgit, #78).
      #
      # Measured on a cold `up`: health flipped 4.0s AFTER "7. production ... started", so the
      # generic version happened not to race -- but 4.0s of margin against a 5s probe interval
      # is luck, not design. `iris_interop_hosts` carries a `production="..."` label, so the
      # gate can name ours and the race disappears by construction.
      #
      # Uses the embedded Apache on 52773, so no gateway is involved.
      #
      # wget, not curl: this image has wget and python3 but NO curl. Checked rather than
      # assumed -- a healthcheck whose binary is missing fails identically to a genuinely
      # unready instance, and would have looked like IRIS never starting.
      #
      # AND NOT /irisHealth.sh, WHICH IS UNRELIABLE AS A GATE. It parses `iris qlist` and
      # requires field 9 to be `ok` or `warn` -- but that field reads `alert` whenever this
      # instance has alerted RECENTLY, and it alerts on startup:
      #   ERROR #5002: ObjectScript error: <METHOD DOES NOT EXIST>Sharding+2^STU *Sharding,SYS.ICM
      #   Previous system shutdown was abnormal, system forced down or crashed
      # The second is guaranteed after any `docker kill`, i.e. after any ungraceful stop.
      #
      # Measured, because my first reading of this was wrong: the field is TIME-SENSITIVE, not
      # latched -- it read `alert` during the "3 alerts in 10 seconds ... suspending alert
      # notifications" window and decayed to `warn` afterwards, staying `warn` across five
      # minutes of polling and across a kill-and-restart. So `/irisHealth.sh` does not fail
      # forever; it fails for a window around startup, which is EXACTLY when a healthcheck
      # gates dependents. That is worse than a permanent failure, because it is intermittent:
      # it left pg-iris `unhealthy` for minutes while it served 200s with 98 interop metric
      # lines and the production at state=1, and it would pass on a re-run.
      #
      # The HTTP probe is the stronger test regardless: it proves the web server, the
      # namespace, the production and metrics collection are all working, which is strictly
      # more than "the instance is up and nothing has alerted lately". Losing the qlist check
      # costs nothing we were relying on, and removes a startup-window race.
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:52773/api/monitor/metrics | grep -q 'production="ProductionGuardian.LabDemo.Production"'
      # 60 x 5s = 5 minutes, which is HEADROOM rather than a measured requirement. Every cold
      # run measured on this image reaches healthy in ~60s, because LABDEMO ships
      # interop-enabled and the slow `EnableNamespace` branch never executes here. An earlier
      # version of this comment justified the budget by "covers a cold EnableNamespace
      # (minutes)", which describes a path that does not run on this image (@tanifgit, #78) --
      # the honest justification is that 5 minutes costs nothing when the normal case is 60s,
      # and an image without the namespace baked in WOULD take the slow path.
      start_period: 0s
      interval: 5s
      timeout: 10s
      retries: 60

  # ─── 3. metrics proxy ───────────────────────────────────────────────────────────────
  metrics-proxy:
    build:
      context: ./services/metrics-proxy
    container_name: pg-metrics-proxy
    ports:
      # Overridable because the host may already be running a dev proxy on 3001 -- which is
      # the normal state while the demo instance is up, so a fixed mapping made the stack
      # un-runnable exactly when someone would most want to compare the two.
      # Container side stays 3001: only the host mapping moves.
      - "${PG_PROXY_PORT:-3001}:3001"
    environment:
      # Straight at IRIS's embedded Apache. IRIS_BASE_PATH stays empty: /api/monitor/ is at
      # the web server root, and a wrong prefix is quiet in a way that reads as an idle
      # production rather than a misconfiguration.
      IRIS_HOST: iris
      IRIS_PORT: "52773"
      IRIS_BASE_PATH: ""
      IRIS_USER: ${PG_IRIS_USER:-superuser}
      IRIS_PASS: ${PG_IRIS_PASS:-SYS}
      IRIS_NAMESPACE: LABDEMO
      IRIS_HOSTSTATUS_PATH: /labdemo/monitor/hoststatus
      # 2500ms per #75. Do not raise this without reading ADR 0005 — it is the one latency
      # term gated by nothing, and it was halved twice deliberately.
      METRICS_POLL_INTERVAL_MS: "2500"
      ALERTS_POLL_INTERVAL_MS: "30000"
    depends_on:
      iris:
        condition: service_healthy

  # ─── 4. detection engine ────────────────────────────────────────────────────────────
  detection-engine:
    build:
      context: ./services/detection-engine
    container_name: pg-detection-engine
    ports:
      # Overridable, same reason as the proxy above. The dashboard reaches the engine over the
      # compose network (HEALTHSCAN_UPSTREAM), so moving the HOST port does not affect it --
      # this mapping is only for curling the findings API from the host.
      - "${PG_ENGINE_PORT:-3002}:3002"
    environment:
      PROXY_MODE: live
      PROXY_BASE_URL: http://metrics-proxy:3001
      # 5000ms, and it has a HARD FLOOR: 4500 already breaks an invariant, because
      # sustainedSeconds must be reachable within sustainedSamples polls with margin (#64).
      # Shortening this means retuning sustainedSeconds in the same change.
      POLL_INTERVAL_MS: "5000"
      # AGENT_MODE is SEPARATE from PROXY_MODE, and defaults to mock even though the proxy is
      # live. Two independent switches because the proxy and the LLM fail independently: a
      # rate-limited or unreachable model must not take the findings API down with it, and the
      # useful default for a fresh `compose up` is live metrics with a canned investigation.
      #
      # `live` needs the AI Hub provider configured in IRIS (docs/mvp2-aihub-verified-api.md)
      # and an API key in the wallet. Neither the key nor the model name is here: the engine
      # holds no LLM credential, and turning this to `live` without the provider gives a 503
      # from the dispatcher rather than a broken investigation.
      AGENT_MODE: ${PG_AGENT_MODE:-mock}
      # Mirrors the iris service's flag -- see there for why it is off by default. The engine only
      # PROXIES to IRIS's trigger routes; it holds no trigger logic of its own, so with the flag off
      # it declines before making a request rather than forwarding one that would 404.
      DEMO_TRIGGERS: ${PG_DEMO_TRIGGERS:-}
      IRIS_BASE_URL: http://iris:52773
      # The ENGINE's IRIS credentials, for the RBAC-gated dispatcher. Same variables as the
      # proxy above, so one override moves both. These authenticate to IRIS; they carry no
      # authority over what may be written -- Tools.Resolve's policy decides that.
      IRIS_USER: ${PG_IRIS_USER:-superuser}
      IRIS_PASS: ${PG_IRIS_PASS:-SYS}
    volumes:
      # Hot-reloaded (ADR 0003), so mounting it lets an operator tune thresholds without a
      # rebuild. Read-only: the engine only ever reads it.
      - ./services/detection-engine/thresholds.json:/app/thresholds.json:ro
    depends_on:
      metrics-proxy:
        condition: service_healthy

  # ─── 5. dashboard ───────────────────────────────────────────────────────────────────
  # Multi-stage: node builds the same single-file bundle the `file://` fallback is verified
  # against, nginx serves it and proxies /api/healthscan.
  #
  # CONTEXT IS THE REPO ROOT, not ./apps/dashboard, since MVP 3 Track B. `BrochureView.tsx`
  # imports `../../../../docs/Brochure.png` so the 1.7 MB asset has exactly one copy in git
  # and no Dockerfile change is needed to ship it (#120). That import cannot resolve from a
  # context rooted at the app directory:
  #
  #   Could not resolve "../../../../docs/Brochure.png" from "src/components/BrochureView.tsx"
  #
  # A host `npm run build` succeeds regardless, because the host has the whole repo. So this
  # was green locally and red in `compose up` -- the same "works and is reached are different
  # claims" gap as iris/CLAUDE.md's three provider defects, arriving through the build context.
  # The `dockerfile:` path must now be repo-relative for the same reason.
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: pg-dashboard
    ports:
      # 5173:80 -- the container listens on 80, not 8080. Keeping 5173 on the host so the
      # URL people already have keeps working. A wrong mapping here looks exactly like a
      # broken proxy from outside, which cost me two minutes on #79.
      - "${PG_DASHBOARD_PORT:-5173}:80"
    environment:
      # The browser runs on the HOST, so it cannot resolve `detection-engine` -- nginx
      # proxies instead, which keeps the bundle environment-independent and makes the
      # container behave identically to the dev server.
      HEALTHSCAN_UPSTREAM: detection-engine:3002
      # OPT-IN, and it is not optional here. The image's 15-local-resolvers.envsh returns
      # early unless this is set, leaving ${NGINX_LOCAL_RESOLVERS} rendered LITERALLY and
      # nginx dead with `host not found in resolver "${NGINX_LOCAL_RESOLVERS}"` -- an error
      # that names the variable and so reads as a typo rather than a missing flag (#79).
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"

    # NO depends_on, DELIBERATELY. nginx resolves the upstream per request rather than at
    # config load, so this serves demo mode with no engine and no IRIS at all -- verified:
    # GET / -> 200 and GET /api -> 502 with 0 restarts, then 200 once the engine appears,
    # without a dashboard restart.
    #
    # Gating it on IRIS would mean nobody sees anything for the minutes IRIS takes to
    # initialise, when demo mode was available the whole time. That is the wrong failure
    # for the one service an audience is looking at.

volumes:
  # Named rather than a bind mount: the LABDEMO namespace, the production definition and
  # the PatientRecord table live here, and they must survive `compose down`. `compose down
  # -v` is the deliberate reset.
  iris-data:
