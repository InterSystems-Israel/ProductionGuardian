name: CI

# Per-path jobs so one developer's push never goes red because another's area is
# mid-refactor (CONTRIBUTING.md §4). Each job only runs when its own paths change.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The job worth more than the other three combined: it validates every file in
  # contracts/samples/ against the schemas, so a contract and the shared fixtures
  # disagreeing is caught here rather than at the Day-5 rehearsal.
  contracts:
    name: contracts — samples vs schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip if contracts/ is absent
        id: guard
        run: |
          if [ -d contracts ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "contracts/ not present yet — skipping"; fi
      # `npm ci` needs a lockfile; fall back to `npm install` before one is committed.
      - name: Install
        if: steps.guard.outputs.present == 'true'
        working-directory: contracts
        run: npm ci || npm install
      # Deliberately not an ajv-cli one-liner. Three reasons, all found on PR #3:
      #   1. validating against the root schema cannot distinguish a hosts array from
      #      a findings array, so that check silently does not happen
      #   2. `-r '#/definitions/...'` is rewritten into a filesystem path by Git Bash
      #   3. `-c ajv-formats` resolves from the invocation directory and silently
      #      ignores `format` when run elsewhere — a validator that quietly weakens
      - name: Validate samples
        if: steps.guard.outputs.present == 'true'
        working-directory: contracts
        run: npm run validate

  detection-engine:
    name: detection-engine — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip if the service is absent
        id: guard
        run: |
          if [ -d services/detection-engine ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "services/detection-engine not present yet — skipping"; fi
      - name: Install
        if: steps.guard.outputs.present == 'true'
        working-directory: services/detection-engine
        run: npm ci || npm install
      - name: Typecheck
        if: steps.guard.outputs.present == 'true'
        working-directory: services/detection-engine
        run: npm run typecheck
      # `node --test <glob>` exits 0 when the glob matches NOTHING, so a moved or renamed
      # test directory would turn this job green while running zero tests -- the same
      # failure mode as `npm test --if-present`, which this repo has now hit five times.
      # Assert a non-zero executed count before trusting the pass. FILES is printed for
      # diagnosis, NOT compared to the count: a per-file test total is not a stable thing
      # to assert, and a comment describing a check the code does not do is this same
      # pattern one level up.
      - name: Test
        if: steps.guard.outputs.present == 'true'
        working-directory: services/detection-engine
        run: |
          # REQUIRED before the `| tee`. Actions' default shell is `bash -e {0}` WITHOUT
          # pipefail, so a pipeline takes tee's exit status and a failing suite reports
          # success -- verified: `fail 1` with a step exit code of 0. Same precedent as the
          # Compile step below.
          set -o pipefail
          # `|| true` AND 2>/dev/null: under -e + pipefail a no-match glob would abort the
          # step at this line, so the explanatory branch below never runs and the operator
          # sees a bare `ls: cannot access`. 2>/dev/null alone is NOT enough — ls still exits
          # 2 and pipefail propagates it (checked). A guard should say why it failed.
          FILES=$( { ls test/*.test.ts 2>/dev/null || true; } | wc -l )
          if [ "$FILES" -eq 0 ]; then echo "no test files found — refusing to report success"; exit 1; fi
          npm test 2>&1 | tee /tmp/engine-test.log
          # `ℹ tests N` is the spec reporter's summary line, which is the default on
          # Node 22+. Anchoring on it rather than TAP's `# tests N`, which is not emitted.
          RAN=$(sed -n 's/^.*[[:space:]]tests \([0-9]\+\)$/\1/p' /tmp/engine-test.log | head -1)
          RAN=${RAN:-0}
          echo "test files on disk: $FILES | tests executed: $RAN"
          if [ "$RAN" -eq 0 ]; then
            echo "npm test reported zero tests — the glob matched nothing"; exit 1
          fi
      # ADR 0004 is a promise the engine must keep: it has to start and serve with
      # Dev A's proxy absent. If this step fails, mock-first is broken.
      #
      # Asserts "serves at least one host", not an exact count. An earlier version
      # hardcoded 4 and went red when FHIR Transform was legitimately removed from the
      # production (#14) -- the engine was right and the assertion was stale. The host
      # count belongs to iris/labdemo/Production.cls, which this job does not own;
      # coupling CI to it makes a correct change look like a regression.
      # Coverage of *which* hosts and findings appear is asserted properly in
      # test/scenario.test.ts, against the fixtures, where it can be kept honest.
      - name: Serves with no proxy running (ADR 0004)
        if: steps.guard.outputs.present == 'true'
        working-directory: services/detection-engine
        run: |
          PORT=3002 POLL_INTERVAL_MS=500 node src/index.ts &
          ENGINE_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3002/api/healthscan/hosts >/dev/null 2>&1; then break; fi
            sleep 1
          done
          HOSTS=$(curl -fsS http://127.0.0.1:3002/api/healthscan/hosts)
          kill "$ENGINE_PID" 2>/dev/null || true
          COUNT=$(printf '%s' "$HOSTS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')
          echo "hosts served with no proxy: $COUNT"
          test "$COUNT" -ge 1

  dashboard:
    name: dashboard — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip if the app is absent
        id: guard
        run: |
          if [ -f apps/dashboard/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "apps/dashboard not present yet — skipping"; fi
      - name: Install
        if: steps.guard.outputs.present == 'true'
        working-directory: apps/dashboard
        run: npm ci || npm install
      - name: Build (runs tsc --noEmit first)
        if: steps.guard.outputs.present == 'true'
        working-directory: apps/dashboard
        run: npm run build
      # Dev C's own fixture validator — keeps demo fixtures honest against the
      # published schema AND against Dev B's shipped thresholds.
      #
      # STRICT, and deliberately without `--if-present`. Both are the same reason: the
      # plain form skips cleanly when `contracts/` or `services/detection-engine/` is
      # absent, which is right for a local dashboard-only checkout and wrong here,
      # because a step that validates nothing while reporting success is indistinguishable
      # from one that validated everything. `--if-present` adds a second copy of that
      # hole -- rename the script and the step goes quietly green.
      #
      # Same failure the `npm test --if-present` fix in #11 addressed, and the one
      # `apps/dashboard/fixtures/README.md` already prescribes the strict form for. Both
      # directories are on `main`, so this passes today; it is closing a latent hole
      # rather than fixing a live break.
      - name: Validate fixtures (strict)
        if: steps.guard.outputs.present == 'true'
        working-directory: apps/dashboard
        run: npm run validate:fixtures:strict

  # Compiles every .cls under iris/ against a real IRIS. Added because THREE defects in
  # that directory reached `main` and were each found by hand rather than by CI:
  #   - HL7ToPID.cls had a stray `"` where `}` belongs, so the DTL never compiled and no
  #     message could reach Cloud API at all (#29)
  #   - PatientDispatcher passed %response.Output, which does not exist, so four REST
  #     routes returned 500 (#37)
  #   - two Storage blocks used the XML end-tag form, which UDL rejects (#17)
  #
  # Uses intersystems/irishealth-community, which is public and needs no credentials --
  # our own instance runs containers.intersystems.com/intersystems/irishealth, which CI
  # cannot pull. Verified locally that this image's USER namespace already has Ens.*,
  # Ens.DataTransformDTL and the HL7 2.5 schema, so no EnableNamespace step is needed.
  #
  # DELIBERATE, and not a divergence anyone maintains: the PRODUCT runs on the EAP IRIS
  # image with the AI Hub feature set, which docker-compose points at via a locally loaded
  # tag (#72). This job uses the public image for one reason only -- a GitHub-hosted runner
  # cannot authenticate to a private registry, and certainly cannot perform an EAP
  # download and `docker load`. So the choice here was never which image to prefer; it was
  # compile-check the ObjectScript on every PR, or not at all.
  #
  # THEREFORE THIS IS A SUBSET CHECK. The community image is a narrower feature set, so
  # "compiles in CI" is weaker evidence than "compiles on the image we ship". It has never
  # been a false PASS -- everything under iris/ uses standard interop (Ens.*,
  # Security.Applications, %SYS.System) -- but the day we depend on an AI-Hub-only class it
  # becomes a false FAIL: this job goes red on correct code, because the class is absent
  # here and present on the image we run.
  #
  # WHEN THAT HAPPENS, do not "fix" it by pointing this job at the EAP image (impossible on
  # a hosted runner) or by deleting it (it is the only machine-independent check that our
  # ObjectScript compiles at all -- ~650 lines of Triggers.cls and FirstBoot.cls that
  # otherwise only one person can run, see #70). The options are, in order of preference:
  #   1. exclude the AI-Hub-dependent classes from LoadDir and say which, so the rest stays
  #      covered and the gap is named
  #   2. a self-hosted runner with the EAP image loaded, which also fixes #70
  #   3. drop the job, and record in #70 that ObjectScript verification is now single-machine
  # Flagged in advance because a red build on correct code is the situation in which the
  # cheapest action is the worst one.
  #
  # Verified to CATCH a real defect, not merely to pass: reintroducing HL7ToPID's stray
  # quote produces `#1011: Invalid name` and the job fails.
  #
  # WHAT IT DOES NOT CATCH, measured rather than assumed: runtime-only defects. Restoring
  # `%ToJSON(%response.Output)` still yields COMPILE OK, because a missing property is
  # only resolved when the line executes. So this covers 2 of the 3 defects that motivated
  # it (#29's DTL, #17's Storage blocks) and NOT #37's. Closing that gap means calling the
  # endpoints, which needs a namespace with the production loaded -- worth doing, and a
  # bigger job than this one.
  iris-compile:
    name: iris — compile ObjectScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if iris/ is absent
        id: guard
        run: |
          if [ -n "$(find iris -name '*.cls' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"; echo "no .cls under iris/ — skipping"
          fi
      - name: Start IRIS for Health (community)
        if: steps.guard.outputs.present == 'true'
        run: |
          # --health-start-period 0 so Docker begins probing immediately; the image
          # defaults to a 60s grace period, which would make every run wait a full minute.
          docker run -d --name pg-iris --health-start-period 0s --health-interval 5s             intersystems/irishealth-community:latest-em

          # Wait on the IMAGE'S OWN healthcheck (/irisHealth.sh) rather than a hand-rolled
          # probe. Two earlier attempts were both wrong in ways only a cold container shows:
          #   - `iris session -U %SYS` answers BEFORE installation finishes, so the next
          #     step died with "Sign-on inhibited: Startup or Installation in progress"
          #   - `iris session -U USER` fed by a heredoc returns <ENDOFFILE> rather than the
          #     marker, and blocks instead of failing fast, which burns the job timeout
          # The vendor's healthcheck is the vendor's definition of ready. Measured: healthy
          # in ~20s locally from cold.
          for i in $(seq 1 60); do
            health=$(docker inspect pg-iris --format '{{.State.Health.Status}}' 2>/dev/null || echo missing)
            if [ "$health" = healthy ]; then echo "IRIS healthy after ~$((i * 5))s"; exit 0; fi
            if [ "$health" = missing ]; then echo "::error::container gone"; docker logs pg-iris | tail -40; exit 1; fi
            sleep 5
          done
          echo "::error::IRIS did not become healthy within 300s (last status: $health)"
          docker logs pg-iris | tail -40; exit 1
      # Flat copy on purpose: iris/ does not mirror the package layout, and LoadDir reads
      # each class's declared name from the file rather than from its path.
      #
      # EXCLUDES the AI-Hub-dependent classes, and this is the day the comment above predicted.
      # They reference %AI.Tool / %AI.Agent, which do not exist in this image -- verified by
      # starting `intersystems/irishealth-community:latest-em` and asking it:
      #
      #     %AI.Tool exists: 0
      #     %AI.Agent exists: 0
      #
      # So compiling them here would fail on CORRECT code. Taking option 1 of the three ranked
      # above -- exclude and SAY WHICH -- rather than dropping the job, which is the cheapest
      # response and the worst one: every other class stays covered, and this comment plus the
      # step output below name the gap so it is not silently assumed.
      #
      # SELECTED BY CONTENT, NOT BY PATH. This was `-not -path 'iris/labdemo/Tools/*'` until
      # AgentDispatcher.cls landed in iris/labdemo/REST/ and failed the job on correct code
      # (#92). The path rule encoded "AI Hub classes live in Tools/", which was true when
      # written and false as soon as the HTTP entry point was added -- and a third hardcoded
      # path in three places is a rule that goes stale again the next time. Grepping for the
      # dependency itself cannot: a new class that touches %AI. is excluded automatically, and
      # one that stops touching it is picked back up.
      #
      # iris/test/ stays a path exclusion because StubPolicy.cls names no %AI. class itself --
      # it EXTENDS one that does, so it is transitively dependent and a content grep misses it.
      # Following Extends chains properly is a compiler's job, not a shell one-liner's; the
      # directory is the honest boundary for test doubles.
      #
      # WHAT THAT COSTS, stated plainly: the AI Hub classes get NO compile check in CI. They are
      # verified only against the EAP image on a developer machine, which is #70's
      # single-machine problem returning in a narrower form. Option 2 (a self-hosted runner with
      # the EAP image) fixes both and is the real answer when someone has the time.
      - name: Copy classes into the container
        if: steps.guard.outputs.present == 'true'
        run: |
          docker exec pg-iris bash -c 'mkdir -p /tmp/pg-iris-src'
          # ONE list, computed once, used for both the copy and the count -- so the notice can
          # never disagree with what was actually compiled. Deriving the two separately is how a
          # report drifts from the thing it reports on.
          #
          # Two rules, unioned: any class that NAMES an %AI. class, plus everything under
          # iris/test/. See the comment above for why the second one cannot also be a grep.
          skip_list=$({ grep -rl '%AI\.' --include='*.cls' iris/; find iris/test -name '*.cls'; } | sed '/^$/d' | sort -u)
          all_list=$(find iris -name '*.cls' | sort)
          copy_list=$(comm -23 <(echo "$all_list") <(echo "$skip_list"))
          # `while read` in a PIPELINE runs in a subshell, so an `exit 1` inside it would not fail
          # this step -- a copy that silently did not happen would show up as a class not compiled
          # rather than as an error. Fed by a here-string instead, so the shell is the same one.
          while read -r f; do
            [ -n "$f" ] || continue
            docker cp "$f" pg-iris:/tmp/pg-iris-src/ || { echo "::error::failed to copy $f"; exit 1; }
          done <<< "$copy_list"
          docker cp tools/ci-compile-iris.txt pg-iris:/tmp/ci-compile-iris.txt
          copied=$(echo "$copy_list" | sed '/^$/d' | wc -l)
          skipped=$(echo "$skip_list" | sed '/^$/d' | wc -l)
          echo "copied $copied classes"
          # Names the files, not just the count. "skipped 4" tells a reader nothing about WHICH
          # coverage they lack, and this list is the gap -- so it should be readable without
          # re-deriving the find expression.
          echo "$skip_list" | sed 's/^/  skipped: /'
          # `paste -sd' '` rather than `tr` for the one-line form: a literal newline inside a
          # YAML block scalar is what a `tr` argument would need, and it breaks the block.
          echo "::notice::skipped $skipped AI-Hub-dependent class(es) — %AI.Tool and %AI.Agent are absent from this image, so they are compile-checked only against the EAP image (see the comment on this step and #77): $(echo "$skip_list" | paste -sd ' ' -)"
      - name: Compile
        if: steps.guard.outputs.present == 'true'
        run: |
          set -o pipefail
          docker exec pg-iris bash -c 'iris session IRIS -U USER < /tmp/ci-compile-iris.txt' 2>&1 | tee /tmp/out.txt
          if grep -q 'COMPILE FAILED' /tmp/out.txt; then
            echo "::error::ObjectScript failed to compile — see the output above"; exit 1
          fi
          if ! grep -q 'COMPILE OK' /tmp/out.txt; then
            echo "::error::no COMPILE OK marker; the driver did not run to completion"; exit 1
          fi
      - name: Tear down
        if: always() && steps.guard.outputs.present == 'true'
        run: docker rm -f pg-iris || true

  metrics-proxy:
    name: metrics-proxy — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip if the service is absent
        id: guard
        run: |
          if [ -f services/metrics-proxy/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "services/metrics-proxy not present yet — skipping"; fi
      # `npm ci` requires a committed lockfile; metrics-proxy has none yet, so prefer it
      # when available and fall back quietly rather than printing a wall of npm errors
      # into a passing job — noise in a green log trains people to stop reading it.
      - name: Install
        if: steps.guard.outputs.present == 'true'
        working-directory: services/metrics-proxy
        run: |
          if [ -f package-lock.json ]; then npm ci
          else echo "no package-lock.json — using npm install (ask Dev A to commit one)"; npm install; fi
      # --if-present means a missing script is a silent pass. That is right for typecheck
      # (metrics-proxy is plain JS and has none) but NOT for tests: a component with no
      # test script should say so out loud rather than report green.
      - name: Typecheck
        if: steps.guard.outputs.present == 'true'
        working-directory: services/metrics-proxy
        run: npm run typecheck --if-present
      # Same zero-test guard as the detection-engine job: `node --test <glob>` exits 0 on
      # no match, so a renamed test file would leave this green having run nothing.
      - name: Test
        if: steps.guard.outputs.present == 'true'
        working-directory: services/metrics-proxy
        run: |
          set -o pipefail   # see the detection-engine Test step; tee would mask a failure
          if ! node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "metrics-proxy defines no test script — refusing to report success"; exit 1
          fi
          FILES=$( { ls src/*.test.js 2>/dev/null || true; } | wc -l )   # see the detection-engine job
          if [ "$FILES" -eq 0 ]; then echo "no test files found"; exit 1; fi
          npm test 2>&1 | tee /tmp/proxy-test.log
          RAN=$(sed -n 's/^.*[[:space:]]tests \([0-9]\+\)$/\1/p' /tmp/proxy-test.log | head -1)
          RAN=${RAN:-0}
          echo "test files on disk: $FILES | tests executed: $RAN"
          if [ "$RAN" -eq 0 ]; then
            echo "npm test reported zero tests — the glob matched nothing"; exit 1
          fi

  # The only job here with no area guard, because the failure it catches is not confined to
  # a directory. Cheap: a checkout and one git command, no toolchain.
  #
  # A NUL byte in a tracked file makes git classify it binary and print `Bin 21868 -> 27238
  # bytes` in place of every diff of it, on the command line and on GitHub. Nothing else
  # breaks — it compiles, tests pass, CI is green — and the only casualty is human review.
  # #157 found a one-line disagreement between two adjacent functions that survived two PRs
  # inside that blind spot (#140 introduced the NUL, #144 changed 5,370 bytes behind it):
  # demo-mode host graphs served empty series for every host and had never worked.
  #
  # NUL specifically, and not "control characters" as #161's title has it, because NUL is the
  # only one with this effect — measured, not assumed: a file containing \x01\x02\x08 diffs
  # normally (`1 +`). Rejecting all control characters would reject things that cost nothing.
  no-nul-bytes:
    name: hygiene — no NUL bytes in tracked text files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THE OBVIOUS ONE-LINER IS SILENTLY BROKEN, which is the only reason this is not one.
      # Both plausible spellings fail, in opposite directions, and both look like a working
      # check from the log. Verified on a scratch repo holding one NUL file and one clean file:
      #
      #   git grep -lIP '\x00'   ->  (nothing), exit 1   WRONG — misses it, reads as clean
      #   git grep -lP  '\x00'   ->  bad.ts,    exit 0   correct
      #   git grep -l $'\x00'    ->  BOTH files, exit 0  WRONG — false positive on everything
      #
      # `-I` means "skip binary files", and a NUL is exactly what makes git call a file binary,
      # so -I excludes the only files that can match. It exits 1 like a clean run, so the
      # `|| true` form filed on #161 would have been green forever. And the pattern must stay
      # the literal four characters `\x00` for git's PCRE to expand: bash cannot hold a NUL in
      # an argument, so $'\x00' collapses to the empty pattern, which matches every file.
      - name: Sweep tracked files for NUL bytes
        run: |
          # git grep exits 0 = matches, 1 = no matches, >1 = git itself failed — e.g. a git
          # built without PCRE, where -P is unavailable. Treating >1 as clean is how this
          # check would come to pass without running, which is the failure mode every other
          # guard in this file exists to prevent.
          set +e
          candidates=$(git grep -lP '\x00' -- .)
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::git grep -P exited $status — the NUL sweep did not run, so this is not a pass"
            exit 1
          fi
          # Genuinely binary files legitimately contain NULs. They are DECLARED `binary` in
          # .gitattributes, which unsets `diff`, and that attribute is what is consulted here
          # rather than a path list — a second copy of "which files are binary" is a thing that
          # goes stale, and this repo has been bitten by a hardcoded list three times (#14, #92).
          # An undeclared file type resolves to `unspecified` and IS swept: a type nobody has
          # classified is the case to fail on, not the case to wave through.
          #
          # ONE `check-attr` invocation over the whole list via --stdin, not one per file. The
          # per-file loop was written first and is unusable: ~250 tracked files means ~500
          # process spawns, which did not finish in two minutes locally. `comm -23` over sorted
          # lists to subtract, the same idiom the iris-compile copy step above uses for the
          # same job, rather than `grep -vf` whose "no lines matched" exit 1 would need a
          # `|| true` that also swallows a real grep failure.
          declared=$(git ls-files | git check-attr --stdin diff | sed -n 's/: diff: unset$//p' | sort)
          offenders=$(comm -23 <(printf '%s\n' "$candidates" | sed '/^$/d' | sort) <(printf '%s\n' "$declared" | sed '/^$/d'))
          if [ -n "$offenders" ]; then
            echo "::error::NUL byte in tracked text file(s) — git diffs these as binary, so every future change to them is unreviewable:"
            printf '%s\n' "$offenders" | sed 's/^/  /'
            echo "If a control character is genuinely wanted as a separator, write it as the escape \\u0000 — byte-identical at runtime and the file stays diffable. Both legitimate uses in this repo do that already: seriesKey in apps/dashboard/src/api/mockClient.ts and SEP in services/detection-engine/src/baseline/window.ts, both because a space is legal in a host name."
            echo "If the file is a real binary, declare it in .gitattributes instead."
            exit 1
          fi
          # Prints the denominator, like the fence counts in contracts/validate.mjs and the
          # executed-test counts above: "found none" and "looked at nothing" are the same log
          # line otherwise.
          tracked=$(git ls-files | wc -l)
          skipped=$(printf '%s\n' "$declared" | sed '/^$/d' | wc -l)
          echo "$tracked tracked files, $skipped declared binary in .gitattributes and skipped — no NUL bytes in the other $((tracked - skipped))"
